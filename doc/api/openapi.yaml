openapi: 3.0.3
info:
  title: VR-RIS PACS — RIS core API
  version: 0.1.0
  description: |
    **BẢN NHÁP v0.1, chờ nhóm xác nhận `02-erd.md`, `03-state-machine.md`, `04-his-ris-reconciliation.md`.**
    Các tài liệu nguồn còn nhiều điểm ❓ (đề xuất, chưa được nhóm xác nhận); mọi điểm ❓ ở đó cũng là ❓ ở đây.
    Spec này là bản viết tay trước, để đối chiếu với springdoc-openapi (IN-20) khi có backend.

    ## Quy ước

    - JSON dùng **snake_case**, đúng tên cột trong ERD (`date_of_birth`, `to_status`, …) ❓.
    - Mã **trạng thái, vai trò, giới tính, `dob_precision`** dùng đúng mã trong ERD (`SCHEDULED / UNREAD / READING / READ / APPROVING / APPROVED / CANCELLED`; `ADMIN / CLINICIAN / TECHNICIAN / RADIOLOGIST / APPROVER`; `M / F / O / U`; `DAY / MONTH / YEAR`). Không dùng mã tiếng Việt (`CHO_THUC_HIEN`, …) như Frontend hiện tại.
    - **Tuổi không phải dữ liệu nhập.** Request của `Patient` có `date_of_birth` + `dob_precision`, **không có `age`**. Response có `age` (chỉ đọc, tính từ ngày sinh) kèm cờ `age_approximate`; `age` là `null` khi chưa có ngày sinh (không bao giờ là 0 vì thiếu dữ liệu).
    - Thời gian là `date-time` theo UTC (ERD 4.7); hiển thị quy đổi `Asia/Ho_Chi_Minh` ở client.
    - **Không có endpoint nào lưu hoặc trả ảnh DICOM** (R-02). RIS chỉ trả `study_instance_uid` để client mở OHIF bằng deep-link. Ảnh lấy từ PACS qua DICOMweb, không qua API này.
    - Không có `DELETE` cho dữ liệu nghiệp vụ (ERD 4.6): hủy ca bằng chuyển trạng thái `CANCELLED`.
    - Phân trang: `page` (từ 1), `page_size`; sắp xếp: `sort=<field>,<asc|desc>`.

    ## Mã lỗi

    | Mã | Ý nghĩa |
    |---|---|
    | 400 | Request sai định dạng |
    | 401 | Chưa đăng nhập hoặc token hết hạn |
    | 403 | Sai vai trò (RBAC chặn ở tầng API, IN-14) |
    | 404 | Không tìm thấy |
    | 409 | Xung đột: chuyển trạng thái không hợp lệ, ca đang bị khóa, hoặc trùng mã |
    | 422 | Thiếu điều kiện nghiệp vụ (ví dụ thiếu lý do, báo cáo thiếu kỹ thuật/kết luận) |
    | 501 | Endpoint tag `future`, chưa làm trong 8 tuần |

    ## Audit log

    **Mọi endpoint ghi hoặc duyệt, và mọi endpoint đọc dữ liệu bệnh nhân, đều ghi `audit_log`** (IN-15). Mỗi operation có trường `x-audit` cho biết hành động ghi (`READ`, `CREATE`, `UPDATE`, `STATUS_CHANGE`, `LOGIN`, …). Backend ghi `actor_username` dạng snapshot (ERD 4.8), `patient_id` nếu có, `before_value`/`after_value` với thao tác ghi.

    ## Bảng endpoint × vai trò

    Chặn ở **tầng API**, không chỉ ẩn nút trên giao diện (IN-14). Mỗi operation có `x-allowed-roles`. Bảng quyền của 5 vai trò ở README Phần 5 vẫn ghi “dự kiến — cần chốt”, nên cột vai trò dưới đây là **đề xuất ❓**.

    | Nhóm endpoint | ADMIN | CLINICIAN | TECHNICIAN | RADIOLOGIST | APPROVER |
    |---|---|---|---|---|---|
    | `POST /auth/login`, `GET /auth/me`, `POST /auth/logout` | ✔ | ✔ | ✔ | ✔ | ✔ |
    | `GET /patients`, `GET /imaging-orders`, `GET /studies` và chi tiết | ✔ | ✔ (chỉ bệnh nhân mình chỉ định ❓) | ✔ | ✔ | ✔ |
    | `POST/PATCH /patients`, `POST/PATCH /imaging-orders`, `POST …/studies` | ✔ | ✔ | ✔ | — | — |
    | `PATCH /studies/{id}` | ✔ | ✔ (trừ `study_instance_uid`) | ✔ | — | — |
    | `POST /studies/{id}/transitions` | Theo `to_status`, xem `03-state-machine.md` mục 2.5 | | | | |
    | `PUT /studies/{id}/reports/current` | — | — | — | ✔ (người đang đọc) | — |
    | `GET /studies/{id}/reports*` | ✔ | ✔ | ✔ | ✔ | ✔ |
    | `GET /imaging-orders/{id}/clinical-snapshot` | ✔ | ✔ (chỉ chỉ định mình chỉ định, D34) | ✔ | ✔ | ✔ |
    | `GET/POST /identity-conflicts*` | ✔ | — | ✔ | — | — |
    | `GET /audit-logs` | ✔ | — | — | — | — |
    | `GET /departments`, `/devices`, `/service-items` | ✔ | ✔ | ✔ | ✔ | ✔ |

    Dữ liệu ví dụ chỉ là dữ liệu giả (mã `TEST…`, tên có hậu tố “Giả”).
  contact:
    name: Nhóm VR-RIS PACS
servers:
  - url: http://localhost:8080/api/v1
    description: Docker Compose / k8s local (NodePort hoặc Ingress) ❓ cổng chưa chốt
tags:
  - name: auth
    description: Đăng nhập, đăng xuất, người dùng hiện tại (IN-13)
  - name: patients
    description: Quản lý bệnh nhân (IN-01)
  - name: imaging-orders
    description: Chỉ định và thông tin lâm sàng (IN-02, IN-11)
  - name: studies
    description: Ca chụp, worklist, chuyển trạng thái (IN-03, IN-06, IN-07, IN-09)
  - name: reports
    description: Báo cáo kết quả có version (IN-10)
  - name: identity-conflicts
    description: Log lệch dữ liệu HIS ↔ RIS (IN-05)
  - name: audit-logs
    description: Nhật ký truy vết (IN-15)
  - name: printing
    description: In phiếu kết quả của một bệnh nhân (Task 5 — đề xuất, chưa được nhóm chốt)
  - name: reference-data
    description: Khoa, máy, danh mục dịch vụ
  - name: future
    description: Chỗ để cho tích hợp HIS/PACS, [HOÃN] (H-01, H-02, H-03). Chưa làm trong 8 tuần, trả 501
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập
      security: []
      x-allowed-roles: [public]
      x-audit: LOGIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: LOGIN
      responses:
        '204':
          description: Đã đăng xuất
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Người dùng và vai trò hiện tại
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      responses:
        '200':
          description: Người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patients:
    get:
      tags: [patients]
      operationId: listPatients
      summary: Tìm bệnh nhân
      description: |
        Tìm theo mã, họ tên hoặc BHXH. Ghi `audit_log` (`READ`) vì trả dữ liệu bệnh nhân.
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: READ
      parameters:
        - name: q
          in: query
          description: Chuỗi tìm tự do trên mã bệnh nhân, họ tên, BHXH
          schema:
            type: string
        - name: patient_code
          in: query
          schema:
            type: string
        - name: full_name
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Danh sách bệnh nhân
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [patients]
      operationId: createPatient
      summary: Tạo bệnh nhân
      description: |
        Chặn trùng `patient_code` (IN-01). Không nhận `age`. Có đối chiếu với bệnh nhân đã có theo
        `04-his-ris-reconciliation.md` mục 1.1 (trường hợp C, D, E).
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN]
      x-audit: CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Trùng `patient_code`, hoặc nghi trùng người (BHXH khớp bệnh nhân khác)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patients/{patientId}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [patients]
      operationId: getPatient
      summary: Chi tiết bệnh nhân
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: READ
      responses:
        '200':
          description: Bệnh nhân
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [patients]
      operationId: updatePatient
      summary: Sửa thông tin bệnh nhân
      description: |
        Sửa tay thông tin có thể đã đồng bộ từ HIS (`04-his-ris-reconciliation.md` mục 3): ghi `audit_log`
        `UPDATE` với `before_value`/`after_value`; lần đồng bộ sau không ghi đè trường đã sửa tay.
        Vai trò sửa tay trường định danh ❓ (đề xuất `TECHNICIAN`, `ADMIN`).
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN]
      x-audit: UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /imaging-orders:
    get:
      tags: [imaging-orders]
      operationId: listImagingOrders
      summary: Danh sách chỉ định
      description: |
        Dùng cho bảng "phiếu cùng bệnh nhân" ở dưới worklist (IN-08): lọc `patient_id`. Ghi `audit_log` (`READ`).
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: READ
      parameters:
        - name: patient_id
          in: query
          schema:
            type: integer
            format: int64
        - name: order_code
          in: query
          schema:
            type: string
        - name: visit_code
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Danh sách chỉ định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingOrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [imaging-orders]
      operationId: createImagingOrder
      summary: Tạo chỉ định (tạo tay)
      description: |
        Tạo `imaging_order` (`source = MANUAL`) và ít nhất một `study` trạng thái `SCHEDULED` kèm `accession_number` sinh tự động
        (quy ước `YYYYMMDD` + 5 chữ số, ERD 4.3). Nếu bệnh nhân có `identity_conflict` ở trạng thái `PENDING`,
        chỉ định bị chặn tạo `study` ❓ (`04-his-ris-reconciliation.md` mục 2.1).
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN]
      x-audit: CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagingOrderCreate'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /imaging-orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [imaging-orders]
      operationId: getImagingOrder
      summary: Chi tiết chỉ định
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: READ
      responses:
        '200':
          description: Chỉ định kèm các ca chụp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [imaging-orders]
      operationId: updateImagingOrder
      summary: Sửa chỉ định
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN]
      x-audit: UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagingOrderUpdate'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /imaging-orders/{orderId}/studies:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [imaging-orders]
      operationId: addStudyToOrder
      summary: Thêm ca chụp vào chỉ định
      description: Một chỉ định có thể có nhiều ca chụp (IN-02). Ca mới ở trạng thái `SCHEDULED`.
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN]
      x-audit: CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyCreate'
      responses:
        '201':
          description: Đã tạo ca chụp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /imaging-orders/{orderId}/clinical-snapshot:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [imaging-orders]
      operationId: getClinicalSnapshot
      summary: Thông tin lâm sàng của chỉ định (JSON)
      description: |
        Trả bản snapshot `clinical_snapshot` (JSON, IN-11). Trong 8 tuần là dữ liệu giả (`source = SEED`).
        Tab 1 (tổng quan khám), tab 2 (xét nghiệm) đọc đầy đủ từ `payload` trả về ở đây. Tab 3 (chẩn
        đoán chức năng) **không** đọc từ snapshot — Frontend tự ghép từ `service_item`/`report` hiện
        hành (RIS tự sinh, `01-scope.md` mục 3.3). Tab 4, 5 luôn là bảng rỗng + ghi chú “chờ tích hợp
        HIS”, bất kể `payload` có gì. `CLINICIAN` chỉ gọi được chỉ định do chính mình chỉ định —
        `imaging_order.ordering_doctor_name` khớp `app_user.full_name` của người gọi (D34,
        `06-rbac-matrix.md` mục 5); không khớp → `403`. Không có snapshot cho chỉ định này → `404`.
        Ghi `audit_log` (`READ`).
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: READ
      responses:
        '200':
          description: Snapshot lâm sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /studies:
    get:
      tags: [studies]
      operationId: listStudies
      summary: Worklist
      description: |
        Mỗi hàng là một **ca chụp** (không phải một chỉ định). Hai tab của giao diện tương ứng
        `tab=PENDING` (chỉ `SCHEDULED`) và `tab=DONE` (các trạng thái còn lại).
        Các khoảng thời gian có sẵn trên giao diện (Hôm nay, Hôm qua, −3, −7, −30 ngày) do client quy đổi thành `date_from`/`date_to`.
        `time_field` chọn loại thời gian để lọc. Bộ lọc “quá hạn”, “đồng bộ HIS”, “BHYT” **không có** (hoãn, `01-scope.md` mục 3.2).
        Ghi `audit_log` (`READ`).
        **Hiện trạng (IN-07, 2026-11-12):** mọi tham số lọc/sắp xếp/phân trang ở dưới đã chạy đúng trên backend
        thật. Phần ghép `patient`/`imaging_order`/`service_item`/`device`/`report` hiện hành thành `WorklistRow`
        (schema `WorklistPage` bên dưới) **chưa làm** - response thật vẫn là `Study` rút gọn (`StudyPageResponse`,
        `items[].study_id|accession_number|...`), chưa có `items[].patient`/`order`/`department`/`report_summary`
        như mô tả `WorklistPage` - việc ghép là IN-07 phần 2, ngoài phạm vi lần sửa này (xem Javadoc
        `rest.StudyController`/`service.StudyService` trong code).
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: READ
      parameters:
        - $ref: '#/components/parameters/WorklistTab'
        - $ref: '#/components/parameters/TimeField'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: status
          in: query
          description: Lọc theo một hoặc nhiều trạng thái
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StudyStatus'
        - name: department_id
          in: query
          description: Khoa hoặc nhóm trong cây khoa → nhóm → máy; gồm cả nhánh con
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: device_id
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: modality
          in: query
          schema:
            $ref: '#/components/schemas/Modality'
        - name: patient_class
          in: query
          schema:
            $ref: '#/components/schemas/PatientClass'
        - name: patient_code
          in: query
          schema:
            type: string
        - name: full_name
          in: query
          schema:
            type: string
        - name: visit_code
          in: query
          description: Mã LSVV
          schema:
            type: string
        - name: order_code
          in: query
          description: Mã phiếu
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Một trang worklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
