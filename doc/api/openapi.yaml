  /studies/{studyId}/transitions:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    post:
      tags: [studies]
      operationId: transitionStudy
      summary: Chuyển trạng thái ca chụp
      description: |
        Thực hiện một chuyển T1–T10 trong `03-state-machine.md`. Backend kiểm lại **mọi** điều kiện (Frontend không phải lớp bảo vệ).
        Mỗi chuyển thành công ghi một dòng `study_status_history` và một dòng `audit_log` (`STATUS_CHANGE`).

        Vai trò được phép phụ thuộc `to_status` ❓ (đề xuất, xem `03-state-machine.md` mục 2.5):

        | Chuyển | Vai trò |
        |---|---|
        | `SCHEDULED → UNREAD` | `TECHNICIAN`, `ADMIN` |
        | `UNREAD → READING` | `RADIOLOGIST` |
        | `READING → UNREAD` (bỏ dở) | người đang đọc, `ADMIN` |
        | `READING → READ` | người đang đọc |
        | `READ → APPROVING` | `APPROVER` |
        | `APPROVING → APPROVED` | `APPROVER` (khác người đọc) |
        | `APPROVING → READING` (trả lại) | `APPROVER` |
        | `APPROVED → READING` (mở lại) | `ADMIN`, `APPROVER` |
        | `SCHEDULED → CANCELLED` | `ADMIN`, `TECHNICIAN` |

        `reason` **bắt buộc** với bỏ dở, trả lại, mở lại, hủy.
      x-allowed-roles: [ADMIN, TECHNICIAN, RADIOLOGIST, APPROVER]
      x-audit: STATUS_CHANGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            examples:
              openToRead:
                summary: Bác sĩ mở ca để đọc
                value:
                  to_status: READING
              returnForRevision:
                summary: Người duyệt trả lại để sửa (cần lý do)
                value:
                  to_status: READING
                  reason: Thiếu mô tả vùng tổn thương (dữ liệu giả)
      responses:
        '200':
          description: Đã chuyển trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sai vai trò, hoặc không phải người đang giữ ca, hoặc người duyệt trùng người đọc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chuyển không hợp lệ từ trạng thái hiện tại, ca đang bị người khác khóa, hoặc yêu cầu đồng thời
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Thiếu điều kiện (ví dụ báo cáo thiếu `technique`/`conclusion`, thiếu `reason`, hủy khi đã có ảnh)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
