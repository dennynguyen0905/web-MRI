      tags: [reference-data]
      operationId: listDevices
      summary: Danh sách máy chụp
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      parameters:
        - name: department_id
          in: query
          schema:
            type: integer
            format: int64
        - name: modality
          in: query
          schema:
            $ref: '#/components/schemas/Modality'
      responses:
        '200':
          description: Danh sách máy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /service-items:
    get:
      tags: [reference-data]
      operationId: listServiceItems
      summary: Danh mục dịch vụ CĐHA
      x-allowed-roles: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
      parameters:
        - name: modality
          in: query
          schema:
            $ref: '#/components/schemas/Modality'
      responses:
        '200':
          description: Danh sách dịch vụ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /integration/his/orders:
    post:
      tags: [future]
      operationId: receiveHisOrder
      summary: "[HOÃN] Nhận chỉ định từ HIS (HL7 v2 ORM^O01)"
      description: |
        **Chưa làm trong 8 tuần (H-03).** Chỉ giữ chỗ. HL7 v2 đi qua MLLP (socket, không phải HTTP); endpoint này đại diện cho
        cổng nội bộ của `HisGateway`. Trong 8 tuần, `HisGateway` đọc file JSON giả.
      x-status: future
      x-allowed-roles: [system]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: Chưa triển khai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /integration/pacs/study-notifications:
    post:
      tags: [future]
      operationId: receivePacsStudyNotification
      summary: "[HOÃN] PACS báo đã nhận ảnh một study"
      description: |
        **Chưa làm trong 8 tuần (H-02).** Về sau PACS gọi vào đây để RIS tự chuyển `SCHEDULED → UNREAD`.
        Trong 8 tuần chuyển này do `TECHNICIAN` làm tay. Không nhận ảnh DICOM (R-02).
      x-status: future
      x-allowed-roles: [system]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '501':
          description: Chưa triển khai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    StudyId:
      name: studyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ConflictId:
      name: conflictId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Số trang, bắt đầu từ 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      description: '`<trường>,<asc|desc>`, ví dụ `scheduled_at,desc`'
      schema:
        type: string
    WorklistTab:
      name: tab
      in: query
      description: '`PENDING` = tab Chờ (chỉ `SCHEDULED`); `DONE` = tab Đã thực hiện (các trạng thái còn lại)'
      schema:
        type: string
        enum: [PENDING, DONE]
    TimeField:
      name: time_field
      in: query
      description: |
        Loại thời gian để lọc `date_from`/`date_to`: `SCHEDULED` (`study.scheduled_at` - thời gian chụp dự kiến),
        `ORDERED` (`imaging_order.ordered_at` - thời gian chỉ định), `COMPLETED` (`study.completed_at` - thời gian
        thực hiện xong; ca chưa có `completed_at` bị loại khi lọc theo trường này). Khớp đúng 3 lựa chọn dropdown
        của Frontend (`Frontend/src/shared/lib/types.ts` - `TimeField`), sửa lại so với bản nháp trước (từng ghi
        `PERFORMED`/`APPROVED` - hai giá trị FE không gửi) khi làm IN-07.
      schema:
        type: string
        enum: [SCHEDULED, ORDERED, COMPLETED]
        default: SCHEDULED
    DateFrom:
      name: date_from
      in: query
      description: Từ ngày (theo múi giờ hiển thị Asia/Ho_Chi_Minh), gồm cả ngày này
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      description: Đến ngày, gồm cả ngày này
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Request sai định dạng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa đăng nhập hoặc token hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sai vai trò (chặn ở tầng API)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột (trùng mã, trạng thái không cho phép, hoặc yêu cầu đồng thời)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Thiếu điều kiện nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi máy đọc được
          example: STUDY_INVALID_TRANSITION
        message:
          type: string
          example: Không thể chuyển từ SCHEDULED sang READING
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
    StudyStatus:
      type: string
      description: Mã trạng thái theo ERD (`02-erd.md` 4.5). `CANCELLED` là đề xuất ❓
      enum: [SCHEDULED, UNREAD, READING, READ, APPROVING, APPROVED, CANCELLED]
    RoleCode:
      type: string
      enum: [ADMIN, CLINICIAN, TECHNICIAN, RADIOLOGIST, APPROVER]
    Gender:
      type: string
      enum: [M, F, O, U]
    DobPrecision:
      type: string
      description: Độ chính xác của `date_of_birth`
      enum: [DAY, MONTH, YEAR]
    PatientClass:
      type: string
      enum: [INPATIENT, OUTPATIENT]
    SyncStatus:
      type: string
      enum: [NOT_SYNCED, SYNCED, RESULT_SENT, FAILED]
    OrderSource:
      type: string
      enum: [MANUAL, HIS]
    Modality:
      type: string
      enum: [CT, MR, CR, DX, US]
    ReportStatus:
      type: string
      enum: [DRAFT, FINAL, APPROVED, RETURNED]
    ReportOrigin:
      type: string
      description: '`AI_DRAFT*` chỉ để chỗ cho giai đoạn AI (H-04); trong 8 tuần luôn là `MANUAL`'
      enum: [MANUAL, AI_DRAFT, AI_DRAFT_EDITED]
    ConflictResolution:
      type: string
      enum: [PENDING, KEEP_RIS, TAKE_HIS, MANUAL_EDIT]
    AuditAction:
      type: string
      enum: [READ, VIEW_IMAGE, CREATE, UPDATE, DELETE, STATUS_CHANGE, LOGIN, PRINT, EXPORT]
    PrintSection:
      type: string
      description: |
        Phần của phiếu kết quả được in, tương ứng 5 tab lâm sàng (README mục 3.3).
        Trong 8 tuần chỉ `FUNCTIONAL` là dữ liệu thật của RIS.
      enum: [OVERVIEW, LABS, FUNCTIONAL, DRUGS, SURGERY]
    PrintEventRequest:
      type: object
      required: [study_id, sections]
      properties:
        study_id:
          type: integer
          format: int64
        sections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrintSection'
    UserRef:
      type: object
      required: [id, full_name]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        full_name:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: bscdha
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Số giây
        user:
          $ref: '#/components/schemas/CurrentUser'
    CurrentUser:
      type: object
      required: [id, username, full_name, roles]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
        department_id:
          type: integer
          format: int64
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleCode'
    Patient:
      type: object
      required: [id, patient_code, full_name, dob_precision, gender]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        patient_code:
          type: string
          description: Khóa đối chiếu chính, ↔ PID-3 loại PI
          example: TEST0001
        his_patient_id:
          type: string
          nullable: true
        full_name:
          type: string
          example: Nguyễn Văn Giả A
        date_of_birth:
          type: string
          format: date
          nullable: true
          description: Khi `dob_precision` là `YEAR` thì lưu `YYYY-01-01`, là `MONTH` thì lưu `YYYY-MM-01`
          example: '1958-01-01'
        dob_precision:
          $ref: '#/components/schemas/DobPrecision'
        age:
          type: integer
          nullable: true
          readOnly: true
          description: Chỉ đọc. Tính từ `date_of_birth` tại thời điểm gọi; `null` nếu chưa có ngày sinh
          example: 68
        age_approximate:
          type: boolean
          readOnly: true
          description: '`true` khi `dob_precision` là `YEAR` hoặc `MONTH` (hiển thị dạng xấp xỉ, ví dụ "~68")'
        gender:
          $ref: '#/components/schemas/Gender'
        social_insurance_no:
          type: string
          nullable: true
          example: GIA0000000001
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatientCreate:
      type: object
      description: Không có `age`
      required: [patient_code, full_name, dob_precision, gender]
      properties:
        patient_code:
          type: string
          example: TEST0001
        full_name:
          type: string
          example: Nguyễn Văn Giả A
        date_of_birth:
          type: string
          format: date
          nullable: true
        dob_precision:
          $ref: '#/components/schemas/DobPrecision'
        gender:
          $ref: '#/components/schemas/Gender'
        social_insurance_no:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    PatientUpdate:
      type: object
      description: Cập nhật từng phần. Không có `age`; không đổi được `patient_code`
      properties:
        full_name:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        dob_precision:
          $ref: '#/components/schemas/DobPrecision'
        gender:
          $ref: '#/components/schemas/Gender'
        social_insurance_no:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    PatientPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Patient'
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
    ImagingOrder:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        order_code:
          type: string
          description: Mã phiếu, ↔ ORC-3 (Filler Order Number, RIS đặt)
          example: PH20261031001
        patient_id:
          type: integer
          format: int64
        visit_code:
          type: string
          nullable: true
          description: Mã LSVV
        source:
          $ref: '#/components/schemas/OrderSource'
        his_order_id:
          type: string
          nullable: true
          description: ↔ ORC-2 (Placer Order Number, HIS đặt)
        sync_status:
          $ref: '#/components/schemas/SyncStatus'
        ordering_department_id:
          type: integer
          format: int64
        ordering_doctor_name:
          type: string
          description: Tên tự do trong 8 tuần (`02-erd.md` mục 9) ❓
        patient_class:
          $ref: '#/components/schemas/PatientClass'
        room:
          type: string
          nullable: true
        bed:
          type: string
          nullable: true
        clinical_diagnosis:
          type: string
          nullable: true
        ordered_at:
          type: string
          format: date-time
        studies:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Study'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ImagingOrderCreate:
      type: object
      required: [patient_id, ordering_department_id, ordering_doctor_name, patient_class, studies]
      properties:
        patient_id:
          type: integer
          format: int64
        visit_code:
          type: string
          nullable: true
        ordering_department_id:
          type: integer
          format: int64
        ordering_doctor_name:
          type: string
        patient_class:
          $ref: '#/components/schemas/PatientClass'
        room:
          type: string
          nullable: true
        bed:
          type: string
          nullable: true
        clinical_diagnosis:
          type: string
          nullable: true
        ordered_at:
          type: string
          format: date-time
          description: Mặc định là thời điểm tạo
        studies:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StudyCreate'
    ImagingOrderUpdate:
      type: object
      properties:
        visit_code:
          type: string
          nullable: true
        ordering_department_id:
          type: integer
          format: int64
        ordering_doctor_name:
          type: string
        patient_class:
          $ref: '#/components/schemas/PatientClass'
        room:
          type: string
          nullable: true
        bed:
          type: string
          nullable: true
        clinical_diagnosis:
          type: string
          nullable: true
    ImagingOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImagingOrder'
    Study:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        accession_number:
          type: string
          readOnly: true
          description: Sinh tự động khi tạo ca (`YYYYMMDD` + 5 chữ số, ERD 4.3); ↔ OBR-18 và DICOM (0008,0050)
          example: '2026103100001'
        order_id:
          type: integer
          format: int64
        service_item_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/StudyStatus'
        study_instance_uid:
          type: string
          nullable: true
          description: Để client mở OHIF bằng deep-link. API không trả ảnh
          example: 1.2.826.0.1.3680043.8.498.10000001
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Bắt đầu chụp
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Kết thúc chụp, đặt khi chuyển `SCHEDULED → UNREAD`
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Luôn `null` cho tới khi định nghĩa “quá hạn” được chốt (README Phần 9 câu 2)
        performed_by:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          type: object
          nullable: true
        reading_user:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          type: object
          nullable: true
        approving_user:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    StudyCreate:
      type: object
      required: [service_item_id, scheduled_at]
      properties:
        service_item_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
          nullable: true
        scheduled_at:
          type: string
          format: date-time
    StudyUpdate:
      type: object
      properties:
        service_item_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
          nullable: true
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        study_instance_uid:
          type: string
          nullable: true
          description: Chỉ `TECHNICIAN`, `ADMIN` được đặt
    StudyDetail:
      allOf:
        - $ref: '#/components/schemas/Study'
        - type: object
          properties:
            patient:
              $ref: '#/components/schemas/Patient'
            order:
              $ref: '#/components/schemas/ImagingOrder'
            service_item:
              $ref: '#/components/schemas/ServiceItem'
            device:
              allOf:
                - $ref: '#/components/schemas/Device'
              type: object
              nullable: true
            current_report:
              allOf:
                - $ref: '#/components/schemas/Report'
              type: object
              nullable: true
    ViewerLink:
      type: object
      description: Thông tin deep-link mở OHIF Viewer cho ca chụp
      required: [study_id, patient_id, study_instance_uid, viewer_url]
      properties:
        study_id:
          type: integer
          format: int64
          example: 1
        patient_id:
          type: integer
          format: int64
          example: 1
        study_instance_uid:
          type: string
          example: '1.2.826.0.1.3680043.8.498.10000001'
        viewer_url:
          type: string
          example: 'http://localhost:8043/viewer/1.2.826.0.1.3680043.8.498.10000001'
    WorklistRow:
      type: object
      description: Một hàng worklist, đã ghép sẵn các bảng liên quan
      properties:
        study:
          $ref: '#/components/schemas/Study'
        order:
          $ref: '#/components/schemas/ImagingOrder'
        patient:
          $ref: '#/components/schemas/Patient'
        service_item:
          $ref: '#/components/schemas/ServiceItem'
        device:
          allOf:
            - $ref: '#/components/schemas/Device'
          type: object
          nullable: true
        department:
          allOf:
            - $ref: '#/components/schemas/Department'
          type: object
          nullable: true
        report_summary:
          type: object
          nullable: true
          description: Lấy từ báo cáo hiện hành; nguồn duy nhất của kỹ thuật và kết luận (`02-erd.md` mục 10)
          properties:
            version:
              type: integer
            status:
              $ref: '#/components/schemas/ReportStatus'
            technique:
              type: string
              nullable: true
            conclusion:
              type: string
              nullable: true
    WorklistPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WorklistRow'
    StatusCounts:
      type: object
      description: Số ca theo trạng thái, tính từ DB tại thời điểm gọi
      required: [total, by_status]
      properties:
        total:
          type: integer
          format: int64
        by_status:
          type: object
          description: Khóa là mã trạng thái; trạng thái không có ca thì trả 0
          additionalProperties:
            type: integer
            format: int64
          example:
            SCHEDULED: 12
            UNREAD: 5
            READING: 2
            READ: 3
            APPROVING: 1
            APPROVED: 40
            CANCELLED: 1
    TransitionRequest:
      type: object
      required: [to_status]
      properties:
        to_status:
          $ref: '#/components/schemas/StudyStatus'
        reason:
          type: string
          nullable: true
          description: Bắt buộc khi bỏ dở, trả lại, mở lại, hủy; chuỗi chỉ có khoảng trắng bị từ chối
        note:
          type: string
          nullable: true
    TransitionResult:
      type: object
      required: [study, history_entry]
      properties:
        study:
          $ref: '#/components/schemas/Study'
        history_entry:
          $ref: '#/components/schemas/StatusHistoryEntry'
        report:
          allOf:
            - $ref: '#/components/schemas/Report'
          type: object
          nullable: true
