# VR-RIS PACS — bản Docker Compose "đầy đủ" (IN-17 docker-compose.yml, doc/01-scope.md mục 3.4):
# mysql + flyway + ris-backend + ris-frontend trong MỘT lệnh, KHÔNG cần Kubernetes. Dùng cho:
#   - Thử nguyên cụm giống k8s nhưng không tốn công cấu hình k8s (ví dụ demo nhanh cho người ngoài nhóm).
#   - Không phải vòng dev HẰNG NGÀY — vòng dev hằng ngày vẫn là database/docker-compose.yml (chỉ
#     MySQL) + `mvn spring-boot:run` + `npm run dev` (build lại ảnh mỗi lần sửa code chậm hơn nhiều
#     so với hot-reload của Vite/Spring DevTools) — xem doc/14-devops-trien-khai.md mục 1.
#
# Chạy (từ bất kỳ đâu — "context:"/"include:" dưới đây được Docker Compose tính tương đối với VỊ
# TRÍ FILE NÀY, không phải thư mục đang gọi lệnh; đã xác nhận bằng `docker compose ... config`):
#   docker compose -f deploy/compose/docker-compose.full.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.full.yml logs -f flyway   # đợi "Successfully applied 8 migrations"
# Mở: http://localhost:8080
#
# "include" (Compose v2.20+, xem `docker compose version`) đưa service mysql/flyway và volume
# mysql_data từ database/docker-compose.yml vào ĐÚNG MỘT project này — không chép lại định nghĩa
# service, khớp nguyên tắc "một thông tin một nguồn" (README mục 6.0).
name: vr-ris-full

include:
  - path: ../../database/docker-compose.yml

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      # Giống hệt gia tri dev local trong Backend/src/main/resources/application.yml, NHUNG
      # SPRING_DATASOURCE_URL doi host "localhost" (dung khi backend chay tren may host, noi voi
      # cong 3307 lo ra ngoai) thanh "mysql" (ten service trong CHINH compose project nay, cong noi
      # bo 3306) - vi backend o day chay TRONG container, cung mang voi mysql.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vr_ris?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ris
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ris_dev_pw}
      TZ: UTC
      # Base URL cua OHIF Viewer cho deep-link (IN-19, IN-23)
      APP_OHIF_BASE_URL: "http://localhost:8043"
      # Profile "default" (KHONG "k8s"): o day van co service "flyway" rieng (tu database/docker-compose.yml,
      # dong vai tro giong het trong k8s la Flyway tu backend chay) lam migration TRUOC qua
      # "depends_on: condition: service_completed_successfully" - backend giu spring.flyway.enabled=false
      # nhu dev local, KHONG dat SPRING_PROFILES_ACTIVE=k8s o day.
    ports:
      - "8081:8080" # chi de debug tu may host (vd curl .../actuator/health); frontend moi la cong chinh.
  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    depends_on:
      - backend
    environment:
      # Ten service Compose la "backend" (khac ten Service k8s "ris-backend", xem
      # deploy/docker/frontend.Dockerfile ENV mac dinh va deploy/k8s/20-configmap.yaml) - day la
      # LY DO CHINH phai dung co che template/envsubst cua nginx thay vi hard-code trong anh.
      BACKEND_UPSTREAM: "backend:8080"
    ports:
      - "8080:80"

  # PACS server (Orthanc) voi DICOMweb bat san (IN-19, doc/07-pacs-dicom.md muc 1, 3.1)
  orthanc:
    image: orthancteam/orthanc:26.9.1
    environment:
      ORTHANC__NAME: "VRRIS_PACS"
      ORTHANC__DICOM_AET: "VRRIS_PACS"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__HTTP_PORT: "8042"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
    ports:
      - "4242:4242" # Port DICOM thuan (C-STORE / C-ECHO)
      - "8042:8042" # Port HTTP DICOMweb (goi truc tiep tu may host de debug; trinh duyet PHAI di
                     # qua "orthanc-cors-proxy" ben duoi, khong goi thang cong nay)
    volumes:
      - orthanc_data:/var/lib/orthanc/db

  # Orthanc KHONG co CORS rieng (xac nhan tu tai lieu chinh thuc: book.orthanc-server.com/plugins/
  # dicomweb.html, muc "properly setup CORS in your reverse proxy") - OHIF (origin :8043) goi
  # QIDO-RS/WADO-RS thang toi Orthanc (origin :8042, khac port = khac origin) se bi trinh duyet
  # chan, OHIF rot ve route "?url=" va bao "No URL was specified" (phat hien khi test IN-19 bang
  # tay 2026-11-09). Proxy nay them header CORS + tra OPTIONS preflight truoc khi forward.
  orthanc-cors-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - orthanc
    ports:
      - "8044:80" # Cong trinh duyet thuc su goi vao (xem ohif-app-config.js)
    volumes:
      - ../docker/orthanc-cors-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  # OHIF Viewer doc anh tu Orthanc qua DICOMweb (IN-19, doc/07-pacs-dicom.md muc 6.1)
  ohif-viewer:
    image: ohif/viewer:v4.12.51.21579
    depends_on:
      - orthanc
      - orthanc-cors-proxy
    ports:
      - "8043:80" # Port Viewer mo tren trinh duyet
    volumes:
      - ../docker/ohif-app-config.js:/usr/share/nginx/html/app-config.js:ro
      # Extension demo (xem chu thich "vr-ris-demo-panel" trong ohif-app-config.js + doc/07-pacs-dicom.md)
      - ../docker/ohif-extensions:/usr/share/nginx/html/extensions:ro

volumes:
  orthanc_data:
