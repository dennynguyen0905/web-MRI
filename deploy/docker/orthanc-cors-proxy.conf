# Orthanc (DICOMweb plugin) khong co CORS rieng (xac nhan tu tai lieu Orthanc chinh thuc,
# book.orthanc-server.com/plugins/dicomweb.html: "properly setup CORS in your reverse proxy").
# OHIF Viewer (origin :8043) va Orthanc (origin :8042) la hai origin khac nhau trong trinh duyet
# (khac port), nen goi QIDO-RS/WADO-RS thang toi Orthanc bi trinh duyet chan, OHIF rot ve route
# "?url=" va bao "No URL was specified" (phat hien khi test IN-19 bang tay 2026-11-09).
# Proxy nay dung truoc Orthanc, them header CORS va tra OPTIONS preflight truoc khi forward.
server {
    listen 80;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain" always;
            return 204;
        }

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        proxy_pass http://orthanc:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
