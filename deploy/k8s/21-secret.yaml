# ⚠️ GIÁ TRỊ GIẢ, CHỈ DÙNG CHO DEV/DEMO TRÊN CỤM K8S LOCAL CỦA TỪNG NGƯỜI — không phải mật khẩu
# thật, không dùng ngoài phạm vi đồ án. Cùng quy ước đã có ở database/docker-compose.yml
# (MYSQL_ROOT_PASSWORD mặc định "root_dev_pw") và Backend/src/main/resources/application.yml
# (JWT secret "dev-only-secret-..."): commit thẳng giá trị giả, không tách riêng ".example" +
# ".gitignore", vì bản thân giá trị không phải bí mật cần giữ — xem doc/09-bao-mat-toan-ven-du-lieu.md
# mục 5.1/9 (câu S-12) và doc/14-devops-trien-khai.md mục 6 để biết vì sao chọn cách này.
#
# ⚠️ k8s Secret CHỈ LÀ BASE64, KHÔNG PHẢI MÃ HÓA — ai đọc được object Secret trong namespace vr-ris
# (ví dụ `kubectl get secret backend-secret -o yaml`) là đọc được giá trị thật ngay. Chấp nhận được
# ở đây (cụm local, dữ liệu giả); trong hệ thống thật cần Sealed Secrets / Vault / KMS
# (doc/09-bao-mat-toan-ven-du-lieu.md mục 5.1).
#
# Đổi giá trị: sửa "stringData" dưới đây (Kubernetes tự base64-encode) rồi "kubectl apply -f" lại —
# KHÔNG sửa "data" bằng tay (đó là base64 thô, dễ gõ sai).
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: vr-ris
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_dev_pw
  MYSQL_PASSWORD: ris_dev_pw
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: vr-ris
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: ris_dev_pw
  # Phải khớp "app.security.jwt.secret" - xem doc/09-bao-mat-toan-ven-du-lieu.md mục 1.1 (HS256,
  # secret ≥ 32 byte). Dùng ĐÚNG chuỗi giả đã có trong application.yml để một image build ra dùng
  # được ở cả hai môi trường (dev local đọc từ application.yml, k8s đọc từ Secret này) mà JWT ký ở
  # một nơi vẫn xác minh được ở nơi khác trong cùng một lần demo.
  APP_SECURITY_JWT_SECRET: "dev-only-secret-khong-dung-cho-production-doi-truoc-khi-deploy-32b"
