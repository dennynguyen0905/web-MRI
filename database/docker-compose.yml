# Database dùng chung cho cả nhóm: MySQL 8 + Flyway chạy các file trong ./migrations.
# Chạy:   docker compose up -d        (trong thư mục database/)
# Xem:    docker compose logs flyway   (phải thấy "Successfully applied 8 migrations")
# Xóa sạch làm lại: docker compose down -v && docker compose up -d
# Mật khẩu dưới đây chỉ dùng cho máy dev của từng người. Muốn đổi: copy .env.example thành .env rồi sửa.

name: vr-ris-db

services:
  mysql:
    image: mysql:8.4
    container_name: vr-ris-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vr_ris}
      MYSQL_USER: ${MYSQL_USER:-ris}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ris_dev_pw}
      TZ: UTC
    # Thống nhất charset, collation và múi giờ UTC cho mọi máy (ERD 4.7).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      # Mặc định 3307 để không đụng MySQL cài sẵn trên máy (thường chiếm 3306).
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  flyway:
    image: flyway/flyway:11
    container_name: vr-ris-flyway
    depends_on:
      mysql:
        condition: service_healthy
    command: -connectRetries=10 migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-vr_ris}?useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USER:-ris}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-ris_dev_pw}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ./migrations:/flyway/sql:ro

volumes:
  mysql_data:
